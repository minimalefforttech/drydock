<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" font-family="Segoe UI, sans-serif">
  <rect width="1000" height="680" fill="#1b1d21"/>
  <text x="24" y="34" font-size="15" fill="#e8e8e8" font-weight="600">F4 — Runtimes list: devs get a dot, TDs get one line per runtime</text>
  <text x="24" y="52" font-size="11" fill="#8a8f98">Scrollable named-runtime registry · per-row expansion · annotated wireframe</text>

  <!-- dev surface -->
  <text x="24" y="88" font-size="11" fill="#6f7580" font-weight="600">WHAT DEVELOPERS SEE — A RAIL DOT + HOVER (follows the current task’s runtime)</text>
  <rect x="24" y="100" width="200" height="30" rx="6" fill="#17181c" stroke="#35383f"/>
  <text x="40" y="120" font-size="12" fill="#9aa0aa">◱ Tasks   ⌾ Agents   <tspan fill="#7dd487">DCC ✓</tspan></text>
  <rect x="240" y="94" width="360" height="42" rx="6" fill="#26282e" stroke="#35383f"/>
  <text x="256" y="112" font-size="11" fill="#d6d8dd">production_tester ready · queue 0 · isolation verified 09:00</text>
  <text x="256" y="128" font-size="10" fill="#6f7580">✓ ready · ▶ running · ⏸ license wait · ⧗ starting · ✕ blocked</text>

  <!-- TD panel -->
  <text x="24" y="172" font-size="11" fill="#6f7580" font-weight="600">TD PANEL — VALIDATION RUNTIMES (list scrolls; expanding never pushes siblings off-screen)</text>
  <rect x="24" y="184" width="640" height="330" rx="8" fill="#24262b" stroke="#35383f"/>
  <text x="44" y="210" font-size="13" fill="#e8e8e8" font-weight="600">Validation runtimes</text>
  <text x="600" y="210" font-size="11" fill="#4da3ff" text-anchor="end">＋ New…</text>
  <text x="628" y="212" font-size="14" fill="#9aa0aa" text-anchor="end">⋯</text>

  <!-- shared mirror row -->
  <rect x="44" y="224" width="588" height="28" rx="4" fill="#1f2126"/>
  <text x="60" y="243" font-size="12" fill="#d6d8dd">Mirror (shared) — v214 · synced 4 min ago</text>
  <text x="616" y="243" font-size="11" fill="#6f7580" text-anchor="end">▸</text>

  <!-- runtime rows -->
  <rect x="44" y="260" width="588" height="28" rx="4" fill="#1f2126"/>
  <text x="60" y="279" font-size="12" fill="#d6d8dd"><tspan fill="#7dd487">●</tspan> default — running · 9.2/16 GB · queue 1 · <tspan fill="#9aa0aa">7 projects</tspan></text>
  <rect x="330" y="264" width="52" height="18" rx="9" fill="#2a2d34"/>
  <text x="356" y="277" font-size="10" fill="#9aa0aa" text-anchor="middle">default</text>
  <text x="616" y="279" font-size="11" fill="#6f7580" text-anchor="end">▸</text>

  <!-- expanded row -->
  <rect x="44" y="296" width="588" height="118" rx="4" fill="#1f2126" stroke="#3a5a8f"/>
  <text x="60" y="316" font-size="12" fill="#d6d8dd"><tspan fill="#f2777a">●</tspan> production_tester — running · idle 12 min</text>
  <rect x="348" y="302" width="118" height="18" rx="9" fill="#4a3535"/>
  <text x="407" y="315" font-size="10" fill="#f0b429" text-anchor="middle">fixtures: ShowA_approved</text>
  <text x="616" y="316" font-size="11" fill="#6f7580" text-anchor="end">▾</text>
  <g font-size="11" fill="#c3c7cf">
    <text x="76" y="340">Runtime — 6.1/12 GB · queue 0 · keep-warm ▸</text>
    <text x="76" y="358">Isolation — verified 09:00 ▸</text>
    <text x="76" y="376">Associations — ShowA_finaling, ShowA_rigs · <tspan fill="#4da3ff">edit</tspan></text>
  </g>
  <text x="76" y="398" font-size="10" fill="#6f7580">⋯ menu: pause · revert to clean… · update image… · remove… (consequences at invoke)</text>

  <rect x="44" y="422" width="588" height="28" rx="4" fill="#1f2126"/>
  <text x="60" y="441" font-size="12" fill="#d6d8dd"><tspan fill="#6f7580">○</tspan> cpp-builds — on-demand (stopped) · MSVC 2022 image · <tspan fill="#9aa0aa">2 projects</tspan></text>
  <text x="616" y="441" font-size="11" fill="#6f7580" text-anchor="end">▸</text>

  <rect x="44" y="458" width="588" height="28" rx="4" fill="#1f2126"/>
  <text x="60" y="477" font-size="12" fill="#d6d8dd"><tspan fill="#7dd487">●</tspan> pipzone — keep-warm · idle 2 h · <tspan fill="#9aa0aa">1 project</tspan></text>
  <text x="616" y="477" font-size="11" fill="#6f7580" text-anchor="end">▸</text>

  <!-- partial row + scrollbar -->
  <rect x="44" y="494" width="588" height="14" rx="4" fill="#1f2126" opacity="0.5"/>
  <text x="60" y="506" font-size="11" fill="#6f7580" opacity="0.7">○ tmp-FR-1201 — per-project · reaps in 4 d…</text>
  <rect x="640" y="224" width="6" height="284" rx="3" fill="#17181c"/>
  <rect x="640" y="224" width="6" height="150" rx="3" fill="#3d414a"/>

  <!-- banner -->
  <text x="24" y="548" font-size="11" fill="#6f7580" font-weight="600">THE ONE EXCEPTION TO CALM — QUARANTINE (per runtime; queue of that runtime blocks)</text>
  <rect x="24" y="558" width="640" height="34" rx="6" fill="#3a2528" stroke="#8f4a4a"/>
  <text x="40" y="580" font-size="11" fill="#f2777a" font-weight="600">⛔ pipzone quarantined — isolation check failed 09:12 · <tspan fill="#4da3ff">probe log · revert &amp; re-probe</tspan></text>

  <text x="24" y="626" font-size="10" fill="#6f7580">Lists scroll in-region (visible scrollbar); L2 expansions cap ≈ 40% panel height and scroll internally;</text>
  <text x="24" y="642" font-size="10" fill="#6f7580">mono logs scroll horizontally inside their own block only; long names middle-truncate with hover.</text>

  <!-- pins -->
  <g font-weight="700" font-size="11">
    <line x1="620" y1="115" x2="700" y2="115" stroke="#f0b429" stroke-dasharray="2,3"/>
    <circle cx="712" cy="115" r="10" fill="#f0b429"/><text x="712" y="119" text-anchor="middle" fill="#1b1d21">1</text>
    <line x1="668" y1="274" x2="700" y2="274" stroke="#f0b429" stroke-dasharray="2,3"/>
    <circle cx="712" cy="274" r="10" fill="#f0b429"/><text x="712" y="278" text-anchor="middle" fill="#1b1d21">2</text>
    <line x1="668" y1="355" x2="700" y2="355" stroke="#f0b429" stroke-dasharray="2,3"/>
    <circle cx="712" cy="355" r="10" fill="#f0b429"/><text x="712" y="359" text-anchor="middle" fill="#1b1d21">3</text>
    <line x1="668" y1="501" x2="700" y2="501" stroke="#f0b429" stroke-dasharray="2,3"/>
    <circle cx="712" cy="501" r="10" fill="#f0b429"/><text x="712" y="505" text-anchor="middle" fill="#1b1d21">4</text>
  </g>

  <!-- legend -->
  <rect x="732" y="88" width="244" height="554" rx="8" fill="#202227" stroke="#35383f"/>
  <text x="748" y="114" font-size="12" fill="#e8e8e8" font-weight="600">Annotations</text>
  <g font-size="11" fill="#c3c7cf">
    <circle cx="756" cy="138" r="8" fill="#f0b429"/><text x="756" y="142" text-anchor="middle" fill="#1b1d21" font-weight="700">1</text>
    <text x="772" y="134">The dot names the runtime the</text>
    <text x="772" y="148">current task routes to — switching</text>
    <text x="772" y="162">projects just changes the label.</text>
    <circle cx="756" cy="190" r="8" fill="#f0b429"/><text x="756" y="194" text-anchor="middle" fill="#1b1d21" font-weight="700">2</text>
    <text x="772" y="186">One line per runtime: state, load,</text>
    <text x="772" y="200">association count. The shared</text>
    <text x="772" y="214">mirror is one row, not repeated.</text>
    <circle cx="756" cy="242" r="8" fill="#f0b429"/><text x="756" y="246" text-anchor="middle" fill="#1b1d21" font-weight="700">3</text>
    <text x="772" y="238">Policy-profile exceptions carry a</text>
    <text x="772" y="252">permanent badge — the one</text>
    <text x="772" y="266">ambient security marker. Concern</text>
    <text x="772" y="280">lines + associations live in the</text>
    <text x="772" y="294">row’s expansion.</text>
    <circle cx="756" cy="322" r="8" fill="#f0b429"/><text x="756" y="326" text-anchor="middle" fill="#1b1d21" font-weight="700">4</text>
    <text x="772" y="318">The list scrolls — per-project</text>
    <text x="772" y="332">runtimes can grow unbounded;</text>
    <text x="772" y="346">reap timers keep them honest.</text>
    <text x="772" y="360">Quarantine blocks one runtime’s</text>
    <text x="772" y="374">queue, not the fleet.</text>
  </g>
  <g font-size="10" fill="#8a8f98">
    <text x="748" y="608">Multi-window: read-only from non-</text>
    <text x="748" y="624">owning windows; pause is global with</text>
    <text x="748" y="640">attribution (ADR 0008).</text>
  </g>
</svg>
