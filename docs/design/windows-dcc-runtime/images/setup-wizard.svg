<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Segoe UI, sans-serif">
  <rect width="1000" height="560" fill="#1b1d21"/>
  <text x="24" y="34" font-size="15" fill="#e8e8e8" font-weight="600">F1 — Setup: done rows collapse, only the row needing you expands</text>
  <text x="24" y="52" font-size="11" fill="#8a8f98">Configure panel → Runtimes → Set up Windows validation runtime · annotated wireframe</text>

  <!-- panel -->
  <rect x="24" y="68" width="640" height="380" rx="8" fill="#24262b" stroke="#35383f"/>
  <text x="44" y="96" font-size="13" fill="#e8e8e8" font-weight="600">Windows validation runtime — Setup</text>
  <text x="600" y="96" font-size="11" fill="#9aa0aa" text-anchor="end">3 / 5</text>

  <!-- collapsed done rows -->
  <rect x="44" y="112" width="600" height="30" rx="4" fill="#1f2126"/>
  <text x="60" y="132" font-size="12" fill="#7dd487">✓ Prerequisites</text>
  <text x="616" y="132" font-size="11" fill="#4da3ff" text-anchor="end">ⓘ</text>

  <rect x="44" y="150" width="600" height="30" rx="4" fill="#1f2126"/>
  <text x="60" y="170" font-size="12" fill="#7dd487">✓ Validation VM — DRYDOCK-VAL-01 imported</text>
  <text x="616" y="170" font-size="11" fill="#4da3ff" text-anchor="end">ⓘ</text>

  <!-- expanded active row -->
  <rect x="44" y="188" width="600" height="120" rx="4" fill="#1f2126" stroke="#3a5a8f"/>
  <text x="60" y="210" font-size="12" fill="#4da3ff" font-weight="600">● Storage — pick a local volume</text>
  <text x="616" y="210" font-size="11" fill="#4da3ff" text-anchor="end">ⓘ</text>
  <text x="76" y="238" font-size="12" fill="#d6d8dd">◉ D:  412 GB free</text>
  <text x="76" y="262" font-size="12" fill="#6f7580">○ E:  180 GB free</text>
  <text x="76" y="286" font-size="10" fill="#6f7580">C: (36 GB) and network volumes are not shown — ineligible.</text>
  <rect x="540" y="270" width="88" height="24" rx="4" fill="#2d5a9e"/>
  <text x="584" y="286" font-size="11" fill="#ffffff" text-anchor="middle">Continue</text>

  <!-- pending rows -->
  <rect x="44" y="316" width="600" height="30" rx="4" fill="#1f2126"/>
  <text x="60" y="336" font-size="12" fill="#6f7580">○ Package mirror — 3 roots + 1 redirect pre-filled from rez_config.py</text>
  <rect x="44" y="354" width="600" height="30" rx="4" fill="#1f2126"/>
  <text x="60" y="374" font-size="12" fill="#6f7580">○ Probes — runs automatically, must pass before first use</text>

  <text x="44" y="416" font-size="10" fill="#6f7580">Rows the wizard can satisfy itself run and collapse on their own. ⓘ = what this step did / undo notes.</text>
  <text x="44" y="434" font-size="10" fill="#6f7580">Group-membership fix (when needed): one elevated button + “sign out, wizard resumes here”.</text>

  <!-- finish state -->
  <text x="24" y="478" font-size="11" fill="#6f7580" font-weight="600">FINISH STATE — ONE LINE</text>
  <rect x="24" y="490" width="640" height="34" rx="6" fill="#24262b" stroke="#2f6b3f"/>
  <text x="40" y="512" font-size="12" fill="#7dd487">✓ Runtime ready · probes green 14:32</text>
  <rect x="576" y="496" width="72" height="22" rx="4" fill="#2d7d46"/>
  <text x="612" y="511" font-size="11" fill="#ffffff" text-anchor="middle">Done</text>

  <!-- pins -->
  <g font-weight="700" font-size="11">
    <line x1="648" y1="127" x2="700" y2="127" stroke="#f0b429" stroke-dasharray="2,3"/>
    <circle cx="712" cy="127" r="10" fill="#f0b429"/><text x="712" y="131" text-anchor="middle" fill="#1b1d21">1</text>
    <line x1="648" y1="248" x2="700" y2="248" stroke="#f0b429" stroke-dasharray="2,3"/>
    <circle cx="712" cy="248" r="10" fill="#f0b429"/><text x="712" y="252" text-anchor="middle" fill="#1b1d21">2</text>
    <line x1="648" y1="331" x2="700" y2="331" stroke="#f0b429" stroke-dasharray="2,3"/>
    <circle cx="712" cy="331" r="10" fill="#f0b429"/><text x="712" y="335" text-anchor="middle" fill="#1b1d21">3</text>
    <line x1="668" y1="507" x2="700" y2="507" stroke="#f0b429" stroke-dasharray="2,3"/>
    <circle cx="712" cy="507" r="10" fill="#f0b429"/><text x="712" y="511" text-anchor="middle" fill="#1b1d21">4</text>
  </g>

  <!-- legend -->
  <rect x="732" y="68" width="244" height="456" rx="8" fill="#202227" stroke="#35383f"/>
  <text x="748" y="94" font-size="12" fill="#e8e8e8" font-weight="600">Annotations</text>
  <g font-size="11" fill="#c3c7cf">
    <circle cx="756" cy="118" r="8" fill="#f0b429"/><text x="756" y="122" text-anchor="middle" fill="#1b1d21" font-weight="700">1</text>
    <text x="772" y="114">Done = a green word. What the</text>
    <text x="772" y="128">step did, and how to undo it,</text>
    <text x="772" y="142">moves behind ⓘ.</text>
    <circle cx="756" cy="170" r="8" fill="#f0b429"/><text x="756" y="174" text-anchor="middle" fill="#1b1d21" font-weight="700">2</text>
    <text x="772" y="166">The screen shows one decision:</text>
    <text x="772" y="180">the active row, minimal control,</text>
    <text x="772" y="194">ineligible options removed —</text>
    <text x="772" y="208">not listed with excuses.</text>
    <circle cx="756" cy="236" r="8" fill="#f0b429"/><text x="756" y="240" text-anchor="middle" fill="#1b1d21" font-weight="700">3</text>
    <text x="772" y="232">Pending rows say what will</text>
    <text x="772" y="246">happen, pre-filled from the</text>
    <text x="772" y="260">rezconfig scan — review, not</text>
    <text x="772" y="274">transcription.</text>
    <circle cx="756" cy="302" r="8" fill="#f0b429"/><text x="756" y="306" text-anchor="middle" fill="#1b1d21" font-weight="700">4</text>
    <text x="772" y="298">Finish is one verified line —</text>
    <text x="772" y="312">“probes green” + time — not a</text>
    <text x="772" y="326">summary page.</text>
  </g>
  <g font-size="10" fill="#8a8f98">
    <text x="748" y="480">Budget: ≤ 15 min; typically 2 stops</text>
    <text x="748" y="496">(group membership, storage). Re-run</text>
    <text x="748" y="512">later = same list, edits in place.</text>
  </g>
</svg>
