<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Segoe UI, sans-serif">
  <rect width="1000" height="640" fill="#1b1d21"/>
  <text x="24" y="34" font-size="15" fill="#e8e8e8" font-weight="600">F2 — Validation chips: one line by default, evidence on request</text>
  <text x="24" y="52" font-size="11" fill="#8a8f98">Chat rail · the chip is the entire default experience · annotated wireframe</text>

  <!-- default section -->
  <text x="24" y="88" font-size="11" fill="#6f7580" font-weight="600">DEFAULT — WHAT DEVS SEE (L1, one line each)</text>

  <rect x="24" y="100" width="640" height="30" rx="6" fill="#24262b" stroke="#35383f"/>
  <text x="40" y="120" font-size="12" fill="#4da3ff">▶ Validating tool_smoke · 0:41 · test_loader_no_network_touch</text>
  <text x="640" y="120" font-size="11" fill="#6f7580" text-anchor="end">▸</text>

  <rect x="24" y="142" width="640" height="30" rx="6" fill="#24262b" stroke="#35383f"/>
  <text x="40" y="162" font-size="12" fill="#7dd487">✓ Validation passed · 1 m 42 s</text>
  <text x="640" y="162" font-size="11" fill="#6f7580" text-anchor="end">▸</text>

  <rect x="24" y="184" width="640" height="30" rx="6" fill="#24262b" stroke="#4a3535"/>
  <text x="40" y="204" font-size="12" fill="#f2777a">✕ 1 of 14 failed · test_icon_fallback — AssertionError: expected default set</text>
  <text x="640" y="204" font-size="11" fill="#6f7580" text-anchor="end">▸</text>

  <rect x="24" y="226" width="640" height="30" rx="6" fill="#24262b" stroke="#35383f"/>
  <text x="40" y="246" font-size="12" fill="#7dd487">✓ Validation passed · 1 m 42 s  <tspan fill="#f0b429">· edited since ↻</tspan></text>
  <text x="640" y="246" font-size="11" fill="#6f7580" text-anchor="end">▸</text>

  <rect x="24" y="268" width="640" height="30" rx="6" fill="#24262b" stroke="#35383f"/>
  <text x="40" y="288" font-size="12" fill="#f0b429">⏸ Waiting for Maya license · 2 ahead</text>
  <text x="640" y="288" font-size="11" fill="#6f7580" text-anchor="end">▸</text>

  <!-- expanded section -->
  <text x="24" y="334" font-size="11" fill="#6f7580" font-weight="600">EXPANDED ON REQUEST (L2, per item, closes with it)</text>

  <rect x="24" y="346" width="640" height="248" rx="6" fill="#24262b" stroke="#35383f"/>
  <text x="40" y="368" font-size="12" fill="#7dd487">✓ Validation passed · 1 m 42 s</text>
  <text x="640" y="368" font-size="11" fill="#6f7580" text-anchor="end">▾</text>
  <rect x="40" y="380" width="608" height="64" rx="4" fill="#17181c"/>
  <g font-family="Consolas, monospace" font-size="11" fill="#c8ccd4">
    <text x="52" y="398">test_icon_fallback_uses_default_set ... ok</text>
    <text x="52" y="414">test_missing_shelf_dir_warns_once ... ok</text>
    <text x="52" y="430">Ran 14 tests in 89.2s — OK</text>
  </g>
  <g font-size="11" fill="#9aa0aa">
    <text x="40" y="466">changeset a3f21c9 · mirror v214 (2 min old) · fixtures none</text>
    <text x="40" y="484">license wait 0 s · image gen 7 · probes green 09:00</text>
  </g>
  <text x="40" y="512" font-size="10" fill="#6f7580">Receipt stamped on subtask “hshelf icon fallback”.</text>
  <g font-size="11" fill="#4da3ff">
    <text x="40" y="540">Open report</text>
    <text x="128" y="540">Re-run</text>
    <text x="186" y="540">Copy receipt</text>
  </g>
  <text x="40" y="576" font-size="10" fill="#6f7580">Same chip from manual runs (subtask card · palette) — identical queue, identical receipt.</text>

  <!-- pins -->
  <g font-weight="700" font-size="11">
    <line x1="668" y1="157" x2="700" y2="157" stroke="#f0b429" stroke-dasharray="2,3"/>
    <circle cx="712" cy="157" r="10" fill="#f0b429"/><text x="712" y="161" text-anchor="middle" fill="#1b1d21">1</text>
    <line x1="668" y1="199" x2="700" y2="199" stroke="#f0b429" stroke-dasharray="2,3"/>
    <circle cx="712" cy="199" r="10" fill="#f0b429"/><text x="712" y="203" text-anchor="middle" fill="#1b1d21">2</text>
    <line x1="668" y1="241" x2="700" y2="241" stroke="#f0b429" stroke-dasharray="2,3"/>
    <circle cx="712" cy="241" r="10" fill="#f0b429"/><text x="712" y="245" text-anchor="middle" fill="#1b1d21">3</text>
    <line x1="668" y1="470" x2="700" y2="470" stroke="#f0b429" stroke-dasharray="2,3"/>
    <circle cx="712" cy="470" r="10" fill="#f0b429"/><text x="712" y="474" text-anchor="middle" fill="#1b1d21">4</text>
  </g>

  <!-- legend -->
  <rect x="732" y="88" width="244" height="506" rx="8" fill="#202227" stroke="#35383f"/>
  <text x="748" y="114" font-size="12" fill="#e8e8e8" font-weight="600">Annotations</text>
  <g font-size="11" fill="#c3c7cf">
    <circle cx="756" cy="138" r="8" fill="#f0b429"/><text x="756" y="142" text-anchor="middle" fill="#1b1d21" font-weight="700">1</text>
    <text x="772" y="134">Green says one line: outcome +</text>
    <text x="772" y="148">duration. No stepper, no hashes,</text>
    <text x="772" y="162">no versions at glance level.</text>
    <circle cx="756" cy="190" r="8" fill="#f0b429"/><text x="756" y="194" text-anchor="middle" fill="#1b1d21" font-weight="700">2</text>
    <text x="772" y="186">Failure promotes exactly one</text>
    <text x="772" y="200">level: the failing test + assertion</text>
    <text x="772" y="214">in the line. Full log stays at L2.</text>
    <circle cx="756" cy="242" r="8" fill="#f0b429"/><text x="756" y="246" text-anchor="middle" fill="#1b1d21" font-weight="700">3</text>
    <text x="772" y="238">“Edited since” is a suffix + re-run</text>
    <text x="772" y="252">affordance, not a second card.</text>
    <text x="772" y="266">License waits take the line only</text>
    <text x="772" y="280">while they ARE the state.</text>
    <circle cx="756" cy="308" r="8" fill="#f0b429"/><text x="756" y="312" text-anchor="middle" fill="#1b1d21" font-weight="700">4</text>
    <text x="772" y="304">Everything else lives in the</text>
    <text x="772" y="318">expansion: output tail, receipt</text>
    <text x="772" y="332">metadata (changeset, mirror,</text>
    <text x="772" y="346">fixtures, license, generations),</text>
    <text x="772" y="360">and actions. Open report = L3.</text>
  </g>
  <g font-size="10" fill="#8a8f98">
    <text x="748" y="556">Disclosure ladder: L0 state color ·</text>
    <text x="748" y="572">L1 one line · L2 in-place expand ·</text>
    <text x="748" y="588">L3 report page.</text>
  </g>
</svg>
